<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/styles.css') }}"
    >

</head>

<body>

<header class="topbar">

    <a
        href="/"
        class="brand"
    >
        FitBuddy
        <span>AI Fitness</span>
    </a>

    <nav>

        <a
            href="/"
            class="nav-link"
        >
            Home
        </a>

        <a
            href="/docs"
            class="nav-link"
        >
            API Docs
        </a>

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    FitBuddy AI Fitness Planner

    <br>

    AI-generated wellness content is educational
    and is not medical advice.

</footer>

</body>

</html>
